<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vishak Ultra Speed Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --accent: #22d3ee;
            --btn: rgba(30, 41, 59, 0.8);
            --glass: rgba(15, 23, 42, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Rajdhani', sans-serif; }

        body {
            background: var(--bg);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* සැහැල්ලු පසුබිම් Animation එකක් */
        body::before {
            content: "";
            position: absolute;
            width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.05) 0%, transparent 70%);
            animation: move 10s linear infinite;
            z-index: -1;
        }

        @keyframes move {
            0% { transform: translate(-20%, -20%); }
            100% { transform: translate(10%, 10%); }
        }

        .container {
            width: 100%; max-width: 450px;
            display: flex; flex-direction: column;
            padding: 20px;
        }

        .display {
            flex: 1; display: flex; flex-direction: column;
            justify-content: flex-end; text-align: right;
            padding: 20px; margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
        }

        #hist { color: #64748b; font-size: 1.1rem; min-height: 1.5em; }
        #out { font-size: 3.5rem; font-weight: 700; margin-top: 5px; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

        button {
            height: 70px; border-radius: 15px; border: none;
            background: var(--btn); color: white;
            font-size: 1.5rem; font-weight: 700;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); background: var(--accent); color: black; }

        .op { color: var(--accent); }
        .special { color: #f97316; }
        .ac { color: #ef4444; }
        .eq { background: var(--accent); color: black; grid-column: span 2; }

        footer { text-align: center; font-size: 0.7rem; color: #475569; margin-top: 15px; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="container">
    <header style="padding: 10px 0; font-family: 'Orbitron'; color: var(--accent); font-size: 0.8rem;">VISHAK PRO V7</header>
    
    <div class="display">
        <div id="hist"></div>
        <div id="out">0</div>
    </div>

    <div class="grid">
        <button class="ac" onclick="cls()">AC</button>
        <button class="special" onclick="del()">DEL</button>
        <button class="op" onclick="op('%')">%</button>
        <button class="op" onclick="op('/')">÷</button>

        <button onclick="num('7')">7</button>
        <button onclick="num('8')">8</button>
        <button onclick="num('9')">9</button>
        <button class="op" onclick="op('*')">×</button>

        <button onclick="num('4')">4</button>
        <button onclick="num('5')">5</button>
        <button onclick="num('6')">6</button>
        <button class="op" onclick="op('-')">−</button>

        <button onclick="num('1')">1</button>
        <button onclick="num('2')">2</button>
        <button onclick="num('3')">3</button>
        <button class="op" onclick="op('+')">+</button>

        <button onclick="num('0')">0</button>
        <button onclick="num('.')">.</button>
        <button class="eq" onclick="res()">=</button>
    </div>
    <footer>OPTIMIZED PERFORMANCE</footer>
</div>

<script>
    let cur = "0", h = "";
    const o = document.getElementById('out'), hi = document.getElementById('hist');

    function up() { o.innerText = cur || "0"; hi.innerText = h; }

    function num(n) { if(cur === "0") cur = n; else cur += n; up(); vib(); }

    function op(p) { cur += " " + p + " "; up(); vib(); }

    function del() {
        if(cur.endsWith(" ")) cur = cur.slice(0, -3);
        else cur = cur.slice(0, -1);
        if(!cur) cur = "0";
        up(); vib();
    }

    function cls() { cur = "0"; h = ""; up(); vib(); }

    function res() {
        try {
            let s = cur.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
            let r = eval(s);
            h = cur + " =";
            cur = Number.isInteger(r) ? r.toString() : r.toFixed(4).replace(/\.?0+$/, "");
            up(); vib();
        } catch { o.innerText = "Err"; setTimeout(cls, 1000); }
    }

    function vib() { if(navigator.vibrate) navigator.vibrate(10); }
</script>
</body>
</html>
